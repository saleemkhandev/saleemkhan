<section class="hero" aria-labelledby="hero-name">
  <div class="hero__inner">
    <p class="hero__eyebrow">Engineering portfolio</p>

    <h1 id="hero-name" class="hero__name">{{ site.name }}</h1>

    <p class="hero__role">{{ site.title }}</p>

    <p class="hero__statement">{{ site.tagline }}</p>

    <div class="hero__actions">
      <a class="hero__cta hero__cta--primary" href="#focus">Explore my work</a>
      <a
        class="hero__cta hero__cta--secondary"
        [href]="githubHref"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>
    </div>
  </div>
</section>
