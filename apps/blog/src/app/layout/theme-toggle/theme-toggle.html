<button
  type="button"
  class="theme-toggle"
  aria-label="Toggle color theme"
  (click)="toggle()"
>
  <svg
    class="theme-toggle__icon theme-toggle__sun"
    viewBox="0 0 24 24"
    aria-hidden="true"
    focusable="false"
  >
    <circle
      cx="12"
      cy="12"
      r="4"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
    />
    <path
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"
    />
  </svg>
  <svg
    class="theme-toggle__icon theme-toggle__moon"
    viewBox="0 0 24 24"
    aria-hidden="true"
    focusable="false"
  >
    <path
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linejoin="round"
      d="M15.1 3.1A9 9 0 1 0 21 12.9 7 7 0 0 1 15.1 3.1z"
    />
  </svg>
</button>
